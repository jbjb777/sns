<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>IP 기록 테스트</title>
</head>
<body>

  <button id="logIp">내 IP 기록하기</button>

  <p id="result"></p>

  <script>
    document.getElementById("logIp").addEventListener("click", async () => {
      const result = document.getElementById("result");

      try {
        const res = await fetch("https://sharer.r-e.kr/api/log-ip", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          }
        });

        const data = await res.json();

        if (data.success) {
          result.textContent = "IP 기록 완료!";
        } else {
          result.textContent = "실패: " + (data.error || "알 수 없는 오류");
        }

      } catch (err) {
        result.textContent = "오류: " + err.message;
      }
    });
  </script>

</body>
</html>
